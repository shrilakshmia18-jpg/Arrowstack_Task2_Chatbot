<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARROWSTACK AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b1020;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 95%;
            background: #121a2f;
            border: 1px solid #26345a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .header {
            padding: 25px 30px;
            background: #182442;
            border-bottom: 1px solid #29385e;
        }

        .brand {
            font-size: 14px;
            color: #5eead4;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .title {
            font-size: 30px;
            margin-top: 8px;
        }

        .subtitle {
            color: #9ca9c9;
            margin-top: 6px;
        }

        .status {
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #86efac;
            font-size: 13px;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
        }

        .chat-box {
            height: 480px;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .bot {
            align-self: flex-start;
            background: #202d4b;
            color: #e8edf8;
            border-bottom-left-radius: 4px;
        }

        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: #182442;
            border-top: 1px solid #29385e;
            display: flex;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            padding: 15px 18px;
            border: 1px solid #34456e;
            border-radius: 12px;
            outline: none;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #3b82f6;
        }

        button {
            padding: 0 25px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            padding: 12px;
            color: #7180a0;
            font-size: 12px;
            background: #10182c;
        }

        @media (max-width: 600px) {

            .title {
                font-size: 24px;
            }

            .chat-box {
                height: 420px;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 15px;
            }

            button {
                padding: 0 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <div class="brand">
                ARROWSTACK AI
            </div>

            <div class="title">
                Intelligent Chatbot Agent
            </div>

            <div class="subtitle">
                Rule-Based & TF-IDF Similarity Chatbot
            </div>

            <div class="status">
                <span class="dot"></span>
                AI SYSTEM ONLINE
            </div>

        </div>


        <div class="chat-box" id="chatBox">

            <div class="message bot">
                Hello! 👋 I am your AI chatbot.

                You can ask me about:
                • Artificial Intelligence
                • Machine Learning
                • Computer Vision
                • Python
                • AI learning resources
            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>


        <div class="footer">
            ARROWSTACK Artificial Intelligence Internship • Task 2
        </div>

    </div>


    <script>

        const input = document.getElementById("messageInput");
        const chatBox = document.getElementById("chatBox");


        function addMessage(message, type) {

            const div = document.createElement("div");

            div.className = "message " + type;

            div.textContent = message;

            chatBox.appendChild(div);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        async function sendMessage() {

            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");

            input.value = "";

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();

                addMessage(data.response, "bot");

            }

            catch (error) {

                addMessage(
                    "Unable to connect to the chatbot server.",
                    "bot"
                );

            }

        }


        input.addEventListener("keypress", function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        });

    </script>

</body>

</html>
